<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 3rem;
            color: #dc3545; /* أحمر للخطأ */
            margin-bottom: 20px;
            text-align: center;
        }

        p {
            font-size: 1.2rem;
            color: #6c757d; /* رمادي */
            margin-bottom: 30px;
        }

        a {
            text-decoration: none;
            padding: 12px 25px;
            background-color: #007bff; /* أزرق */
            color: white;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #0056b3; /* أزرق غامق عند المرور */
        }

        .container {
            text-align: center;
            background-color: white;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${status} + '  - - -  ' + ${message}">error</h1>
    <p th:text="${timestamp}">time</p>
    <a   th:href="@{/computers_store}">Back to Products</a>
</div>
</body>
</html>
