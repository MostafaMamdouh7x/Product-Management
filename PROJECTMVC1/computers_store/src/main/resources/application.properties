spring.application.name=computers_store
server.port=9090
images.dir = ../product-imgs-spring-MVC/images/

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/computers_store
spring.datasource.username=mostafa
spring.datasource.password=1234
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20

# JPA / Hibernate configs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.initialization-mode=always

# logging

logging.file.path=/logging/logs
logging.file.name=${logging.file.path}/logs.log
logging.file.max-size=10MB
logging.file.max-history=5

# I18N
#spring.messages.basename=messages
#spring.messages.encoding=UTF-8

# caching

spring.cache.type=caffeine
spring.cache.cache-names=products
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m
management.endpoints.web.exposure.include=health,info,metrics,caches

